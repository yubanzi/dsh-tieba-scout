# ============================================================================
# dsh-tieba-scout —— 插件自带的挂载声明
# ============================================================================
# 装好之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#   dsh plugin --profile web add dsh-tieba-scout
#   （本地开发：dsh plugin --profile web add link:G:/DSH-QQ/packages/dsh-tieba-scout）
# ============================================================================

- insert:
    - id: tieba-scout
      name: dsh-tieba-scout
      config:
        # 真正的用户配置在插件自己的 config.json 与设置页里，这里只放默认值
        enabled: true